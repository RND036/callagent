  change_language: භාෂාව වෙනස් කරන්න, කරුණාකර ඔබේ දුරකථනයේ {key} ඔබන්න.
  please_repeat: සමාවෙන්න, මට හරියට ඇහුණෙ නෑ, ආයෙත් පොඩ්ඩක් කියන්න පුළුවන්ද?
  out_of_scope: සමාවෙන්න, මට උදව් කරන්න පුළුවන් {salon_name} එකේ bookings සහ services ගැන විතරයි. ඔබට nail service එකක් ගැන දැනගන්න අවශ්‍යද?
  anything_else: ඔබට වෙනත් යමක් දැනගැනීමට අවශ්‍යද?
  price_rule: Always say "රුපියල් [ගණන]" (e.g. "රුපියල් 2,500ක්", "රුපියල් 3,500ක්", "රුපියල් 4,000යි").
  phone_style: Say it as four groups said as numbers (e.g. "බිංදුව හැත්තෑ හත, එකසිය විසි තුන, හතළිස් පහ, හැට හත").
